# alembic.ini — Alembic configuration for WorldStitch
#
# Usage:
#   alembic upgrade head        — apply all pending migrations
#   alembic downgrade -1        — roll back the last migration
#   alembic revision --autogenerate -m "describe change"  — generate a new migration
#   alembic history             — show applied/pending history
#
# The database URL is resolved in migrations/env.py from the DATABASE_URL env var.
# DATABASE_URL is required — there is no fallback. Example:
#   export DATABASE_URL=postgresql+psycopg2://user:pass@localhost:5432/worldstitch

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is always overridden by DATABASE_URL in env.py.
# This placeholder prevents Alembic from complaining about a missing key.
sqlalchemy.url = postgresql://PLACEHOLDER_SET_DATABASE_URL_ENV_VAR

[post_write_hooks]
# (none configured)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
